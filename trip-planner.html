<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B1E3D;
    --parchment:#EFE9F5;
    --card:#FBF8FE;
    --teal:#6B4E9B;
    --teal-dark:#4E3676;
    --mustard:#C9A6E8;
    --rust:#8E3B6B;
    --line:#C9B8DE;
    --line-soft:#DDD0EA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
  }
  .app-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .app-header h1{
    font-size:32px;
    letter-spacing:-0.01em;
  }
  .app-header .note{
    font-size:12.5px;
    color:var(--teal-dark);
    max-width:220px;
    text-align:right;
    line-height:1.4;
  }

  /* trip switcher */
  .trip-switcher{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:4px 2px 14px;
    scrollbar-width:thin;
  }
  .trip-stub{
    position:relative;
    flex:0 0 auto;
    width:196px;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:3px;
    padding:14px 14px 12px;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .trip-stub:hover{ transform:translateY(-2px); }
  .trip-stub.active{
    background:var(--ink);
    color:var(--card);
    border-color:var(--ink);
  }
  .trip-stub.active .trip-stub-dest{ color:var(--mustard); }
  .trip-stub-dest{
    font-family:'Fraunces', serif;
    font-size:18px;
    font-weight:600;
    color:var(--teal-dark);
    margin-bottom:4px;
  }
  .trip-stub-name{ font-size:13px; opacity:.85; margin-bottom:8px; }
  .trip-stub-dates{
    font-size:11.5px;
    font-family:'IBM Plex Mono', monospace;
    opacity:.75;
    border-top:1px dashed var(--line);
    padding-top:6px;
  }
  .trip-stub.active .trip-stub-dates{ border-top-color:rgba(251,248,239,.35); }

  .add-trip-stub{
    flex:0 0 auto;
    width:196px;
    border:1.5px dashed var(--line);
    border-radius:3px;
    background:transparent;
    color:var(--teal-dark);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:88px;
  }
  .add-trip-stub:hover{ background:rgba(63,107,102,.06); }

  /* add trip form */
  .card-form{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:3px;
    padding:18px;
    margin-bottom:22px;
  }
  .card-form h3{ font-size:18px; margin-bottom:12px; }
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:12px; color:var(--teal-dark); font-weight:500; }
  .field input, .field select, .field textarea{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  .form-actions{ display:flex; gap:10px; margin-top:6px; }

  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:13.5px;
    padding:9px 16px;
    border-radius:3px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--card);
    cursor:pointer;
  }
  .btn:hover{ background:var(--teal-dark); border-color:var(--teal-dark); }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border-color:var(--line);
  }
  .btn.secondary:hover{ border-color:var(--ink); }
  .ghost-btn{
    background:none;
    border:none;
    color:var(--rust);
    font-size:12.5px;
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
    padding:4px 0;
    text-decoration:underline;
  }

  /* trip banner */
  .trip-banner{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    background:var(--ink);
    color:var(--card);
    border-radius:3px;
    padding:18px 20px;
    margin-bottom:18px;
    gap:14px;
  }
  .trip-banner h2{ font-size:26px; color:var(--card); }
  .trip-banner .dest{ color:var(--mustard); font-family:'Fraunces',serif; font-weight:600;}
  .trip-banner p{ margin:4px 0 0; font-size:13px; opacity:.85; font-family:'IBM Plex Mono', monospace; }

  /* tabs */
  .tabs{
    display:flex;
    border-bottom:1.5px solid var(--ink);
    margin-bottom:18px;
    gap:4px;
  }
  .tab{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    background:none;
    border:none;
    padding:10px 14px 8px;
    cursor:pointer;
    color:var(--teal-dark);
    border-bottom:3px solid transparent;
    margin-bottom:-1.5px;
  }
  .tab.active{
    color:var(--ink);
    border-bottom-color:var(--mustard);
  }

  .panel.hidden, .hidden{ display:none !important; }

  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .section-head h3{ font-size:16px; }

  /* list items styled like tickets */
  .item-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-start;
  }
  .item-main{ flex:1; }
  .item-title{ font-weight:600; font-size:14.5px; margin-bottom:2px; }
  .item-sub{ font-size:12.5px; color:var(--teal-dark); }
  .item-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink);
    opacity:.7;
    margin-top:4px;
  }
  .item-notes{ font-size:12.5px; margin-top:6px; opacity:.85; }
  .route{ font-family:'Fraunces', serif; font-size:16px; font-weight:600; }
  .route .arrow{ color:var(--mustard); margin:0 6px; }

  .day-group{ margin-bottom:16px; }
  .day-heading{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.02em;
    color:var(--teal-dark);
    border-bottom:1px dashed var(--line-soft);
    padding-bottom:5px;
    margin-bottom:8px;
  }
  .todo-row{ display:flex; align-items:flex-start; gap:10px; }
  .todo-row input[type=checkbox]{ margin-top:3px; width:16px; height:16px; accent-color:var(--teal); }
  .todo-row.done .item-title{ text-decoration:line-through; opacity:.55; }

  .empty-panel{
    font-size:13.5px;
    color:var(--teal-dark);
    padding:18px 4px;
    border:1px dashed var(--line);
    border-radius:3px;
    text-align:center;
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--teal-dark);
    font-size:15px;
  }
  .status-msg{ font-size:13px; color:var(--teal-dark); padding:20px 4px; }

  @media (max-width:480px){
    .field-grid{ grid-template-columns:1fr; }
    .app{ padding:20px 14px 70px; }
    .app-header h1{ font-size:26px; }
    .app-header .note{ text-align:left; max-width:100%; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Waypoint</h1>
    <p class="note">Shared with anyone who opens this app — trips, transport and bookings sync for everyone.</p>
  </header>

  <div id="tripSwitcher" class="trip-switcher"></div>

  <div id="addTripForm" class="card-form hidden">
    <h3>New trip</h3>
    <div class="field-grid">
      <div class="field full">
        <label for="f-name">Trip name</label>
        <input id="f-name" type="text" placeholder="e.g. Summer in Portugal">
      </div>
      <div class="field full">
        <label for="f-dest">Destination</label>
        <input id="f-dest" type="text" placeholder="e.g. Lisbon & the Algarve">
      </div>
      <div class="field">
        <label for="f-start">Start date</label>
        <input id="f-start" type="date">
      </div>
      <div class="field">
        <label for="f-end">End date</label>
        <input id="f-end" type="date">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" id="saveTripBtn">Create trip</button>
      <button class="btn secondary" id="cancelTripBtn">Cancel</button>
    </div>
  </div>

  <p id="emptyState" class="empty-state hidden">No trips yet. Add your first one above to start planning.</p>
  <p id="loadingMsg" class="status-msg">Loading your trips…</p>

  <main id="tripMain" class="hidden">
    <div class="trip-banner">
      <div>
        <h2 id="tripNameEl"></h2>
        <p id="tripDestDatesEl"></p>
      </div>
      <button class="ghost-btn" id="deleteTripBtn">Delete trip</button>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="transport">Transport</button>
      <button class="tab" data-tab="stays">Stays</button>
      <button class="tab" data-tab="plan">Plan</button>
    </nav>

    <section id="panel-transport" class="panel"></section>
    <section id="panel-stays" class="panel hidden"></section>
    <section id="panel-plan" class="panel hidden"></section>
  </main>
</div>

<script>
(function(){
  let trips = [];          // [{id,name,destination,startDate,endDate}]
  let currentTripId = null;
  let currentTripData = null; // {info, transport:[], stays:[], itinerary:[]}
  let activeTab = 'transport';

  const el = id => document.getElementById(id);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2));

  function fmtDate(d){
    if(!d) return '';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
  }
  function fmtDateShort(d){
    if(!d) return '';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined, { day:'numeric', month:'short' });
  }

  async function loadTripsIndex(){
    try{
      const res = await window.storage.get('trips-index', true);
      trips = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      trips = [];
    }
  }
  async function saveTripsIndex(){
    try{
      await window.storage.set('trips-index', JSON.stringify(trips), true);
    }catch(e){
      console.error('Could not save trips index', e);
    }
  }
  async function loadTripData(tripId){
    try{
      const res = await window.storage.get('trip-data:' + tripId, true);
      return res && res.value ? JSON.parse(res.value) : null;
    }catch(e){
      return null;
    }
  }
  async function saveTripData(tripId, data){
    try{
      await window.storage.set('trip-data:' + tripId, JSON.stringify(data), true);
    }catch(e){
      console.error('Could not save trip data', e);
    }
  }
  async function deleteTripData(tripId){
    try{ await window.storage.delete('trip-data:' + tripId, true); }catch(e){ /* ignore */ }
  }

  function renderTripSwitcher(){
    const box = el('tripSwitcher');
    box.innerHTML = '';
    trips.forEach(t => {
      const stub = document.createElement('div');
      stub.className = 'trip-stub' + (t.id === currentTripId ? ' active' : '');
      stub.innerHTML = `
        <div class="trip-stub-dest">${escapeHtml(t.destination || 'Somewhere new')}</div>
        <div class="trip-stub-name">${escapeHtml(t.name)}</div>
        <div class="trip-stub-dates">${fmtDateShort(t.startDate)} – ${fmtDateShort(t.endDate)}</div>
      `;
      stub.addEventListener('click', () => selectTrip(t.id));
      box.appendChild(stub);
    });
    const addStub = document.createElement('button');
    addStub.className = 'add-trip-stub';
    addStub.textContent = '+ New trip';
    addStub.addEventListener('click', () => {
      el('addTripForm').classList.remove('hidden');
      el('f-name').focus();
    });
    box.appendChild(addStub);
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function selectTrip(tripId){
    currentTripId = tripId;
    renderTripSwitcher();
    el('tripMain').classList.add('hidden');
    el('loadingMsg').classList.remove('hidden');
    el('loadingMsg').textContent = 'Loading trip…';

    let data = await loadTripData(tripId);
    if(!data){
      const info = trips.find(t => t.id === tripId);
      data = { info: info || {}, transport: [], stays: [], itinerary: [] };
      await saveTripData(tripId, data);
    }
    currentTripData = data;
    el('loadingMsg').classList.add('hidden');
    el('tripMain').classList.remove('hidden');
    renderTripBanner();
    renderActivePanel();
  }

  function renderTripBanner(){
    const info = currentTripData.info || {};
    el('tripNameEl').innerHTML = `${escapeHtml(info.name || '')} <span class="dest">— ${escapeHtml(info.destination || '')}</span>`;
    el('tripDestDatesEl').textContent = `${fmtDate(info.startDate)}  →  ${fmtDate(info.endDate)}`;
  }

  function setActiveTab(tab){
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    el('panel-' + tab).classList.remove('hidden');
    renderActivePanel();
  }

  function renderActivePanel(){
    if(activeTab === 'transport') renderTransportPanel();
    else if(activeTab === 'stays') renderStaysPanel();
    else renderPlanPanel();
  }

  /* ---------- TRANSPORT ---------- */
  function renderTransportPanel(){
    const panel = el('panel-transport');
    const list = (currentTripData.transport || []).slice().sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    panel.innerHTML = `
      <div class="section-head">
        <h3>Getting there and around</h3>
        <button class="btn secondary" id="addTransportBtn">+ Add leg</button>
      </div>
      <div id="addTransportForm" class="card-form hidden">
        <div class="field-grid">
          <div class="field">
            <label>Type</label>
            <select id="t-type">
              <option value="Flight">Flight</option>
              <option value="Train">Train</option>
              <option value="Car">Car</option>
              <option value="Ferry">Ferry</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label>Carrier / company</label>
            <input id="t-carrier" type="text" placeholder="e.g. TAP Air Portugal">
          </div>
          <div class="field">
            <label>From</label>
            <input id="t-from" type="text" placeholder="e.g. London Heathrow">
          </div>
          <div class="field">
            <label>To</label>
            <input id="t-to" type="text" placeholder="e.g. Lisbon">
          </div>
          <div class="field">
            <label>Date</label>
            <input id="t-date" type="date">
          </div>
          <div class="field">
            <label>Time</label>
            <input id="t-time" type="time">
          </div>
          <div class="field">
            <label>Confirmation code</label>
            <input id="t-conf" type="text" placeholder="e.g. XR4K9P">
          </div>
          <div class="field full">
            <label>Notes</label>
            <textarea id="t-notes" rows="2" placeholder="Seat numbers, terminal, luggage allowance…"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" id="saveTransportBtn">Save leg</button>
          <button class="btn secondary" id="cancelTransportBtn">Cancel</button>
        </div>
      </div>
      <div id="transportList"></div>
    `;
    const listBox = panel.querySelector('#transportList');
    if(list.length === 0){
      listBox.innerHTML = '<div class="empty-panel">No transport added yet — add flights, trains or cars above.</div>';
    } else {
      list.forEach(leg => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="item-main">
            <div class="item-sub">${escapeHtml(leg.type)}${leg.carrier ? ' · ' + escapeHtml(leg.carrier) : ''}</div>
            <div class="route">${escapeHtml(leg.from)}<span class="arrow">→</span>${escapeHtml(leg.to)}</div>
            <div class="item-meta">${fmtDate(leg.date)}${leg.time ? ' · ' + leg.time : ''}${leg.confirmation ? ' · Conf: ' + escapeHtml(leg.confirmation) : ''}</div>
            ${leg.notes ? `<div class="item-notes">${escapeHtml(leg.notes)}</div>` : ''}
          </div>
          <button class="ghost-btn" data-del="${leg.id}">Remove</button>
        `;
        listBox.appendChild(row);
      });
      listBox.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          currentTripData.transport = currentTripData.transport.filter(x => x.id !== btn.dataset.del);
          await saveTripData(currentTripId, currentTripData);
          renderTransportPanel();
        });
      });
    }

    panel.querySelector('#addTransportBtn').addEventListener('click', () => {
      panel.querySelector('#addTransportForm').classList.remove('hidden');
    });
    panel.querySelector('#cancelTransportBtn').addEventListener('click', () => {
      panel.querySelector('#addTransportForm').classList.add('hidden');
    });
    panel.querySelector('#saveTransportBtn').addEventListener('click', async () => {
      const from = panel.querySelector('#t-from').value.trim();
      const to = panel.querySelector('#t-to').value.trim();
      const date = panel.querySelector('#t-date').value;
      if(!from || !to || !date){
        alert('Please fill in at least from, to and date.');
        return;
      }
      const leg = {
        id: uid(),
        type: panel.querySelector('#t-type').value,
        carrier: panel.querySelector('#t-carrier').value.trim(),
        from, to, date,
        time: panel.querySelector('#t-time').value,
        confirmation: panel.querySelector('#t-conf').value.trim(),
        notes: panel.querySelector('#t-notes').value.trim()
      };
      currentTripData.transport = currentTripData.transport || [];
      currentTripData.transport.push(leg);
      await saveTripData(currentTripId, currentTripData);
      renderTransportPanel();
    });
  }

  /* ---------- STAYS ---------- */
  function renderStaysPanel(){
    const panel = el('panel-stays');
    const list = (currentTripData.stays || []).slice().sort((a,b) => (a.checkIn||'').localeCompare(b.checkIn||''));
    panel.innerHTML = `
      <div class="section-head">
        <h3>Places to stay</h3>
        <button class="btn secondary" id="addStayBtn">+ Add stay</button>
      </div>
      <div id="addStayForm" class="card-form hidden">
        <div class="field-grid">
          <div class="field full">
            <label>Hotel / place name</label>
            <input id="s-name" type="text" placeholder="e.g. Casa Baixa">
          </div>
          <div class="field full">
            <label>Address</label>
            <input id="s-address" type="text" placeholder="Street, city">
          </div>
          <div class="field">
            <label>Check-in</label>
            <input id="s-checkin" type="date">
          </div>
          <div class="field">
            <label>Check-out</label>
            <input id="s-checkout" type="date">
          </div>
          <div class="field">
            <label>Confirmation code</label>
            <input id="s-conf" type="text" placeholder="e.g. BK-88213">
          </div>
          <div class="field">
            <label>Cost</label>
            <input id="s-cost" type="text" placeholder="e.g. €340 total">
          </div>
          <div class="field full">
            <label>Notes</label>
            <textarea id="s-notes" rows="2" placeholder="Room type, check-in instructions…"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" id="saveStayBtn">Save stay</button>
          <button class="btn secondary" id="cancelStayBtn">Cancel</button>
        </div>
      </div>
      <div id="staysList"></div>
    `;
    const listBox = panel.querySelector('#staysList');
    if(list.length === 0){
      listBox.innerHTML = '<div class="empty-panel">No stays added yet — add your hotel or rental above.</div>';
    } else {
      list.forEach(stay => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="item-main">
            <div class="item-title">${escapeHtml(stay.name)}</div>
            ${stay.address ? `<div class="item-sub">${escapeHtml(stay.address)}</div>` : ''}
            <div class="item-meta">${fmtDate(stay.checkIn)} → ${fmtDate(stay.checkOut)}${stay.confirmation ? ' · Conf: ' + escapeHtml(stay.confirmation) : ''}${stay.cost ? ' · ' + escapeHtml(stay.cost) : ''}</div>
            ${stay.notes ? `<div class="item-notes">${escapeHtml(stay.notes)}</div>` : ''}
          </div>
          <button class="ghost-btn" data-del="${stay.id}">Remove</button>
        `;
        listBox.appendChild(row);
      });
      listBox.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          currentTripData.stays = currentTripData.stays.filter(x => x.id !== btn.dataset.del);
          await saveTripData(currentTripId, currentTripData);
          renderStaysPanel();
        });
      });
    }

    panel.querySelector('#addStayBtn').addEventListener('click', () => {
      panel.querySelector('#addStayForm').classList.remove('hidden');
    });
    panel.querySelector('#cancelStayBtn').addEventListener('click', () => {
      panel.querySelector('#addStayForm').classList.add('hidden');
    });
    panel.querySelector('#saveStayBtn').addEventListener('click', async () => {
      const name = panel.querySelector('#s-name').value.trim();
      const checkIn = panel.querySelector('#s-checkin').value;
      const checkOut = panel.querySelector('#s-checkout').value;
      if(!name || !checkIn || !checkOut){
        alert('Please fill in at least the name, check-in and check-out dates.');
        return;
      }
      const stay = {
        id: uid(),
        name,
        address: panel.querySelector('#s-address').value.trim(),
        checkIn, checkOut,
        confirmation: panel.querySelector('#s-conf').value.trim(),
        cost: panel.querySelector('#s-cost').value.trim(),
        notes: panel.querySelector('#s-notes').value.trim()
      };
      currentTripData.stays = currentTripData.stays || [];
      currentTripData.stays.push(stay);
      await saveTripData(currentTripId, currentTripData);
      renderStaysPanel();
    });
  }

  /* ---------- PLAN / ITINERARY ---------- */
  function renderPlanPanel(){
    const panel = el('panel-plan');
    const items = (currentTripData.itinerary || []).slice();
    const byDay = {};
    items.forEach(it => {
      const key = it.date || 'No date';
      byDay[key] = byDay[key] || [];
      byDay[key].push(it);
    });
    const days = Object.keys(byDay).sort();

    panel.innerHTML = `
      <div class="section-head">
        <h3>Things to do</h3>
        <button class="btn secondary" id="addPlanBtn">+ Add item</button>
      </div>
      <div id="addPlanForm" class="card-form hidden">
        <div class="field-grid">
          <div class="field">
            <label>Date</label>
            <input id="p-date" type="date">
          </div>
          <div class="field">
            <label>Time (optional)</label>
            <input id="p-time" type="time">
          </div>
          <div class="field full">
            <label>What</label>
            <input id="p-title" type="text" placeholder="e.g. Belém Tower + pastel de nata stop">
          </div>
          <div class="field full">
            <label>Notes</label>
            <textarea id="p-notes" rows="2" placeholder="Booking link, meeting point, tips…"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" id="savePlanBtn">Add to plan</button>
          <button class="btn secondary" id="cancelPlanBtn">Cancel</button>
        </div>
      </div>
      <div id="planList"></div>
    `;
    const listBox = panel.querySelector('#planList');
    if(days.length === 0){
      listBox.innerHTML = '<div class="empty-panel">Nothing planned yet — add things to see and do above.</div>';
    } else {
      days.forEach(day => {
        const group = document.createElement('div');
        group.className = 'day-group';
        const heading = document.createElement('div');
        heading.className = 'day-heading';
        heading.textContent = day === 'No date' ? 'No date set' : fmtDate(day);
        group.appendChild(heading);
        byDay[day].sort((a,b) => (a.time||'').localeCompare(b.time||'')).forEach(it => {
          const row = document.createElement('div');
          row.className = 'item-row todo-row' + (it.done ? ' done' : '');
          row.innerHTML = `
            <input type="checkbox" ${it.done ? 'checked' : ''} data-toggle="${it.id}">
            <div class="item-main">
              <div class="item-title">${it.time ? `<span class="item-meta">${it.time}</span> ` : ''}${escapeHtml(it.title)}</div>
              ${it.notes ? `<div class="item-notes">${escapeHtml(it.notes)}</div>` : ''}
            </div>
            <button class="ghost-btn" data-del="${it.id}">Remove</button>
          `;
          group.appendChild(row);
        });
        listBox.appendChild(group);
      });
      listBox.querySelectorAll('[data-toggle]').forEach(cb => {
        cb.addEventListener('change', async () => {
          const item = currentTripData.itinerary.find(x => x.id === cb.dataset.toggle);
          if(item){ item.done = cb.checked; }
          await saveTripData(currentTripId, currentTripData);
          renderPlanPanel();
        });
      });
      listBox.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          currentTripData.itinerary = currentTripData.itinerary.filter(x => x.id !== btn.dataset.del);
          await saveTripData(currentTripId, currentTripData);
          renderPlanPanel();
        });
      });
    }

    panel.querySelector('#addPlanBtn').addEventListener('click', () => {
      panel.querySelector('#addPlanForm').classList.remove('hidden');
    });
    panel.querySelector('#cancelPlanBtn').addEventListener('click', () => {
      panel.querySelector('#addPlanForm').classList.add('hidden');
    });
    panel.querySelector('#savePlanBtn').addEventListener('click', async () => {
      const title = panel.querySelector('#p-title').value.trim();
      const date = panel.querySelector('#p-date').value;
      if(!title || !date){
        alert('Please fill in at least what it is and the date.');
        return;
      }
      const item = {
        id: uid(),
        date,
        time: panel.querySelector('#p-time').value,
        title,
        notes: panel.querySelector('#p-notes').value.trim(),
        done: false
      };
      currentTripData.itinerary = currentTripData.itinerary || [];
      currentTripData.itinerary.push(item);
      await saveTripData(currentTripId, currentTripData);
      renderPlanPanel();
    });
  }

  /* ---------- APP INIT / TRIP CRUD ---------- */
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
  });

  el('cancelTripBtn').addEventListener('click', () => {
    el('addTripForm').classList.add('hidden');
  });

  el('saveTripBtn').addEventListener('click', async () => {
    const name = el('f-name').value.trim();
    const destination = el('f-dest').value.trim();
    const startDate = el('f-start').value;
    const endDate = el('f-end').value;
    if(!name || !startDate || !endDate){
      alert('Please add at least a trip name, start date and end date.');
      return;
    }
    const trip = { id: uid(), name, destination, startDate, endDate };
    trips.push(trip);
    await saveTripsIndex();
    await saveTripData(trip.id, { info: trip, transport: [], stays: [], itinerary: [] });
    el('f-name').value = ''; el('f-dest').value = ''; el('f-start').value=''; el('f-end').value='';
    el('addTripForm').classList.add('hidden');
    el('emptyState').classList.add('hidden');
    renderTripSwitcher();
    await selectTrip(trip.id);
  });

  el('deleteTripBtn').addEventListener('click', async () => {
    if(!currentTripId) return;
    const trip = trips.find(t => t.id === currentTripId);
    if(!confirm(`Delete "${trip ? trip.name : 'this trip'}"? This removes all its transport, stays and plans.`)) return;
    trips = trips.filter(t => t.id !== currentTripId);
    await saveTripsIndex();
    await deleteTripData(currentTripId);
    currentTripId = null;
    currentTripData = null;
    el('tripMain').classList.add('hidden');
    renderTripSwitcher();
    if(trips.length === 0){
      el('emptyState').classList.remove('hidden');
    } else {
      await selectTrip(trips[0].id);
    }
  });

  async function init(){
    el('loadingMsg').classList.remove('hidden');
    await loadTripsIndex();
    el('loadingMsg').classList.add('hidden');
    renderTripSwitcher();
    if(trips.length === 0){
      el('emptyState').classList.remove('hidden');
    } else {
      await selectTrip(trips[0].id);
    }
  }
  init();
})();
</script>
</body>
</html>
